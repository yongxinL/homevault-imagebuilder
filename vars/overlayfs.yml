# Build phase 3 variables — overlay filesystem (build_overlayfs.yml)
# ==================================================================
# These variables configure the overlayfs build phase that installs the
# application services (Nginx, PHP-FPM, MariaDB, Webmin) on top of the
# read-only base filesystem to produce filesystem.squashfs.
# Loaded only by roles/common/overlayfs_wrapper.yml.

# .. contents:: Sections
#    :local:

# .. envvar:: build_root
#
# Path to the overlayfs merged mount point used as the chroot in this phase.
# The kernel overlayfs driver merges basefs.squashfs (lower/read-only) with the
# upper directory (read-write) at this path so service packages are installed
# into the overlay layer only.
build_root: '{{ build_rootfs }}'
