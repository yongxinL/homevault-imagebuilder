# Build phase 4 variables — ISO image assembly (build_image.yml)
# ==============================================================
# These variables configure the image-build phase that assembles the final
# bootable ISO from the artefacts produced in phases 1–3.
# Loaded only by roles/common/image_wrapper.yml.

# .. contents:: Sections
#    :local:

# .. envvar:: build_root
#
# Path to the chroot used during the image-build phase.
# In this phase the chroot is only used to copy syslinux binaries out of the
# rootfs into the ISO directory tree; no new packages are installed here.
build_root: '{{ build_rootfs }}'
