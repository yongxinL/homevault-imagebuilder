# Default variables for the services/ansible role
# ================================================
# Installs ansible-core into the target image using pip3.
#
# Ubuntu 24 (Noble) ships ansible-core 2.16.x in the universe repository.
# For ansible-core 2.20+ (as required by this project), pip3 is used because
# the Ubuntu archive does not yet carry 2.20.
#
# Python: Always uses the python3 interpreter bundled with the target Ubuntu
# release — no separate Python installation is added to the image.
#
# Changes from Ubuntu 16 (Xenial):
#   REMOVED  PPA ppa:ansible/ansible   — does not support Noble
#   REMOVED  python-httplib2 / python-jinja2 / python-yaml (Python 2 packages)
#   REMOVED  easy_install               — removed in Ansible 2.10+
#   REMOVED  pysphere pip module        — superseded by pyvmomi
#   ADDED    pip3 install ansible-core  — installs 2.20 via PyPI

# .. envvar:: install_role_name
#
# Internal name used for log messages.
install_role_name: 'ansible'

# .. envvar:: ansible_core_version
#
# The ansible-core version to install via pip3.
# Use '2.20.*' to allow patch releases, or pin to an exact version like '2.20.0'.
# See https://pypi.org/project/ansible-core/#history for available versions.
ansible_core_version: '2.20.*'

# .. envvar:: ansible_base_packages
#
# Ubuntu packages installed before pip3 is used to install ansible-core.
# python3-pip provides the pip3 command from the Ubuntu archive.
# python3-venv is included for use with pipx if required in future.
ansible_base_packages:
  - { package: 'python3-pip' }
  - { package: 'python3-venv' }

# .. envvar:: ansible_packages
#
# Python 3 packages installed via pip3 alongside ansible-core.
# These provide optional Ansible module dependencies.
#
# Changes from Ubuntu 16:
#   REMOVED  python-httplib2   → python3-httplib2 available via apt or pip
#   REMOVED  python-jinja2     → bundled with ansible-core
#   REMOVED  python-markupsafe → bundled with ansible-core
#   REMOVED  python-paramiko   → bundled with ansible-core
#   REMOVED  python-yaml       → bundled with ansible-core
ansible_packages:
  - { package: 'httplib2' }      # HTTP client library for Ansible URI module
  - { package: 'paramiko' }      # SSH library for Ansible (fallback to OpenSSH)

# .. envvar:: ansible_modules
#
# Additional pip3 packages providing Ansible collection dependencies.
# pyvmomi: VMware vSphere / ESXi API Python bindings (required for vmware_* modules).
# NOTE: pysphere is superseded by pyvmomi and removed.
ansible_modules:
  - { package: 'pyvmomi' }       # VMware vSphere Python SDK (for vmware_* Ansible modules)
