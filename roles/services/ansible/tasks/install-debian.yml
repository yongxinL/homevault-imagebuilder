# =============================================================================
# services/ansible — Install Ansible Core via pip3
# =================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Install python3-pip and python3-venv from the Ubuntu repository.
#   2. Install ansible-core via pip3 (version controlled by ansible_core_version).
#   3. Install additional Python packages (httplib2, paramiko) via pip3.
#   4. Install pyvmomi for VMware vSphere module support.
#
# Why pip3 instead of the Ubuntu PPA?
#   - ppa:ansible/ansible does not support Ubuntu 24 (Noble).
#   - Ubuntu Noble's universe repository ships ansible-core 2.16.x only.
#   - pip3 allows pinning to ansible-core 2.20.x as required by this project.
#
# Note: --break-system-packages is required on Ubuntu 24 (Noble) / Python 3.12+
#   due to PEP 668, which marks the system Python as externally managed and
#   blocks system-wide pip installs by default. This is safe in a chroot build
#   environment where the image is isolated from the host.
#
# Python interpreter: always uses /usr/bin/python3 bundled with Ubuntu Noble.
# =============================================================================

---
# ---- Ubuntu package prerequisites ----

- name: "ansible | Install python3-pip and python3-venv from Ubuntu repository"
  ansible.builtin.apt:
    name: "{{ item.package }}"
    state: present
    install_recommends: false
    update_cache: true
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ ansible_base_packages }}"

# ---- Install ansible-core via pip3 ----

- name: "ansible | Install ansible-core {{ ansible_core_version }} via pip3"
  ansible.builtin.pip:
    name: "ansible-core=={{ ansible_core_version }}"
    state: present
    executable: pip3
    extra_args: "--break-system-packages"

# ---- Install companion Python packages via pip3 ----

- name: "ansible | Install Python companion packages via pip3"
  ansible.builtin.pip:
    name: "{{ item.package }}"
    state: present
    executable: pip3
    extra_args: "--break-system-packages"
  loop: "{{ ansible_packages }}"

# ---- Install Ansible module dependencies ----

- name: "ansible | Install Ansible module dependencies via pip3 (e.g. pyvmomi)"
  ansible.builtin.pip:
    name: "{{ item.package }}"
    state: present
    executable: pip3
    extra_args: "--break-system-packages"
  loop: "{{ ansible_modules }}"
