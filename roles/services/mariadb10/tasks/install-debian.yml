---
- name: create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Both the legacy and current MariaDB signing keys are retrieved over HTTPS
# from the keyserver (replaces apt_key keyserver= lookups). Downloading both
# unconditionally avoids depending on ansible_lsb facts, which are unavailable
# in a minimal chroot.
- name: download {{ install_role_name }} repository GPG signing keys from keyserver
  ansible.builtin.get_url:
    url: "https://{{ mariadb_repo_keyserver }}/pks/lookup?op=get&search=0x{{ item }}"
    dest: "/etc/apt/keyrings/{{ install_role_name }}-{{ item }}.asc"
    mode: '0644'
    force: true
  loop: "{{ mariadb_repo_keys }}"

- name: add {{ install_role_name }} repository list
  lineinfile: 
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: yes
    state: present
  with_items: "{{ mariadb_repository }}"

- name: install required {{ install_role_name }} packages
  apt: 
    name: "{{ item.package }}={{ item.version|default('*') }}"
    install_recommends: no
    update_cache: yes
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  loop: "{{ [mariadb_base_packages, mariadb_packages] | flatten }}"

- name: remove {{ install_role_name }} repository list
  file: 
    path: "{{ item.dest }}"
    state: absent
  with_items: "{{ mariadb_repository }}"
 