---
- name: create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download {{ install_role_name }} repository GPG signing key
  ansible.builtin.get_url:
    url: "{{ beat_repo_key }}"
    dest: "{{ beat_repo_keyring }}"
    mode: '0644'
    force: true

- name: add {{ install_role_name }} repository list
  lineinfile: 
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: yes
    state: present
  with_items: "{{ beat_repository }}"

- name: install required {{ install_role_name }} packages
  apt: 
    name: "{{ item.package }}={{ item.version|default('*') }}"
    install_recommends: no
    update_cache: yes
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  loop: "{{ [beat_base_packages] | flatten }}"

- name: copy {{ install_role_name }} configuration files
  copy:
    src: "{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode|default('0644') }}"
    backup: no
  with_items: "{{ beat_configuration }}"

- name: remove {{ install_role_name }} repository list
  file: 
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ beat_repository | flatten }}"

- name: disable {{ install_role_name }} service list
  service: 
    name: "{{ install_role_name }}"
    enabled: "{{ beat_boot_on_start }}"