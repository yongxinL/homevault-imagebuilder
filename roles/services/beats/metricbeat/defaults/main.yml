# Default variables
# =================

# .. contents:: Sections
#    :local:
#
# ------------------------------------
#   Packages and installation
# ------------------------------------
install_role_name: 'metricbeat'

# .. envvar:: beat_repo_key
#
# URL of the Elastic APT repository GPG signing key (ASCII-armored).
beat_repo_key: 'https://artifacts.elastic.co/GPG-KEY-elasticsearch'

# .. envvar:: beat_repo_keyring
#
# Path where the signing key is stored inside the target image.
# Referenced by the signed-by= option in beat_repository.
# NOTE: armored .asc keys in signed-by require apt >= 2.4 (Ubuntu 22.04+).
beat_repo_keyring: '/etc/apt/keyrings/{{ install_role_name }}.asc'

# .. envvar:: beat_version
#
# APT GPG key server and id used to sign the Docker packages.
beat_version: '5.x'

# .. envvar:: apt_proxy
#
# Specify apt cacher / proxy link, like 'x.x.x.x:3142/'
apt_proxy:

# .. envvar:: beat_repository
#
# Address of the Elastic upstream APT repository, authenticated via the
# keyring downloaded from beat_repo_key.
beat_repository:
  - { dest: '/etc/apt/sources.list.d/{{ install_role_name }}.list', line: 'deb [signed-by={{ beat_repo_keyring }}] https://artifacts.elastic.co/packages/{{ beat_version }}/apt stable main' }

# .. envvar:: beat_base_packages
#
# List of base packages to install by Ansible
# package: package will be installed
# version: package version, default is '*'
# example: - { package: 'package', version: '1.2' }
beat_base_packages:
  - { package: '{{ install_role_name }}' }

# .. envvar:: beat_configuration
#
# List of configuration file will be copy to Linux base filesystems
beat_configuration:
  - { name: '{{ install_role_name }}.yml', dest: '/etc/{{ install_role_name }}/{{ install_role_name }}.yml' }

# .. envvar:: nodejs_base_packages
#
# Start the service when booting
beat_boot_on_start: no