# Default variables
# =================

# .. contents:: Sections
#    :local:
#
# ------------------------------------
#   Packages and installation
# ------------------------------------
install_role_name: "users"

# .. envvar:: default_
#
# Specify default user configuration
default_password: ""
default_shell: "/bin/bash"

# .. envvar:: group_lists
#
# Specify default user configuration
groups_lists:
    - { name: "oneLijia", gid: "500" }

# Passwords are stored as SHA-512 crypt hashes (format: $6$...).
# To generate a new hash:  python3 -c "from passlib.hash import sha512_crypt; print(sha512_crypt.hash('yourpassword'))"
