---
- name: add {{ install_role_name }} repository keys and source list
  block:
    - ansible.builtin.file:
        path: "/etc/apt/keyrings"
        state: directory
        mode: '0755'

    # Keyserver lookup over HTTPS returns the ASCII-armored public key,
    # saved directly into the APT keyrings directory.
    - ansible.builtin.get_url:
        url: "https://{{ item.server }}/pks/lookup?op=get&search=0x{{ item.keyid }}"
        dest: "{{ phpfpm_repo_keyring }}"
        mode: '0644'
        force: true
      loop: "{{ repo_key | default([]) }}"

    - ansible.builtin.get_url:
        url: "{{ item }}"
        dest: "{{ phpfpm_repo_keyring }}"
        mode: '0644'
        force: true
      loop: "{{ repo_gpg | default([]) }}"

    - ansible.builtin.lineinfile:
        dest: "{{ item.dest }}"
        line: "{{ item.line }}"
        create: yes
        state: present
      with_items:
        - "{{ repository | default([]) }}"
        
- name: install packages for {{ install_role_name }}
  block:
    - apt:
        autoclean: yes

    - apt:
        name: "{{ item.package }}={{ item.version | default('*') }}"
        install_recommends: no
        update_cache: yes
      with_items:
        - "{{ base_packages | default([]) }}"

    - file:
        path: "{{ item.dest }}"
        state: absent
      with_items:
        - "{{ repository | default([]) }}"

    - template:
        src: "{{ item.name }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode|default('0644') }}"
        backup: no
      with_items: 
        - "{{ configure_files | default([]) }}"

    - copy:
        src: "{{ item.name }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode|default('0644') }}"
        backup: no
      with_items: 
        - "{{ extra_files | default([]) }}"