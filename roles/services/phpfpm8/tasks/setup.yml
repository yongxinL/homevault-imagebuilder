---
- name: update {{ install_role_name }} configure files
  block:
      - lineinfile:
            dest: "/etc/php/{{ phpfpm_version }}/fpm/php.ini"
            regexp: "{{ item.regxp }}"
            line: "{{ item.line }}"
            state: present
        with_items:
            - {
                  regxp: "^(.?)allow_url_fopen(.?)=.*",
                  line: "allow_url_fopen = on",
              }
            - {
                  regxp: "^(.?)max_execution_time(.?)=.*",
                  line: "max_execution_time = 600",
              }
            - {
                  regxp: "^(.?)(.?)max_input_vars(.?)=.*",
                  line: "max_input_vars = 5000",
              }
            - { regxp: "^(.?)memory_limit(.?)=.*", line: "memory_limit = 512M" }
            - {
                  regxp: "^(.?)cgi.fix_pathinfo(.?)=.*",
                  line: "cgi.fix_pathinfo = 1",
              }
            - {
                  regxp: "^(.?)opcache.enable(.?)=.*",
                  line: "opcache.enable = 1",
              }
            - {
                  regxp: "^(.?)opcache.enable_cli(.?)=.*",
                  line: "opcache.enable_cli = 1",
              }
            - {
                  regxp: "^(.?)opcache.memory_consumption(.?)=.*",
                  line: "opcache.memory_consumption = 128",
              }
            - {
                  regxp: "^(.?)opcache.interned_strings_buffer(.?)=.*",
                  line: "opcache.interned_strings_buffer = 16",
              }
            - {
                  regxp: "^(.?)opcache.max_accelerated_files(.?)=.*",
                  line: "opcache.max_accelerated_files = 10000",
              }
            - {
                  regxp: "^(.?)opcache.max_wasted_percentage(.?)=.*",
                  line: "opcache.max_wasted_percentage = 5",
              }
            - {
                  regxp: "^(.?)opcache.validate_timestamps(.?)=.*",
                  line: "opcache.validate_timestamps = 0",
              }
            - {
                  regxp: "^(.?)opcache.revalidate_freq(.?)=.*",
                  line: "opcache.revalidate_freq = 60",
              }
            - {
                  regxp: "^(.?)opcache.save_comments(.?)=.*",
                  line: "opcache.save_comments = 1",
              }
            - {
                  regxp: "^(.?)opcache.fast_shutdown(.?)=.*",
                  line: "opcache.fast_shutdown = 1",
              }
            - { regxp: "^(.?)opcache.jit(.?)=.*", line: "opcache.jit = 1255" }
            - {
                  regxp: "^(.?)opcache.jit_buffer_size(.?)=.*",
                  line: "opcache.jit_buffer_size = 128M",
              }
            - {
                  regxp: "^(.?)post_max_size(.?)=.*",
                  line: "post_max_size = 512M",
              }
            - {
                  regxp: "^(.?)session.use_trans_sid(.?)=.*",
                  line: "session.use_trans_sid = 0",
              }
            - {
                  regxp: "^(.?)upload_max_filesize(.?)=.*",
                  line: "upload_max_filesize = 512M",
              }
            - {
                  regxp: "^(.?)zlib.output_compression(.?)=.*",
                  line: "zlib.output_compression = Off",
              }

      - lineinfile:
            dest: "/etc/php/{{ phpfpm_version }}/fpm/php-fpm.conf"
            regexp: "{{ item.regxp }}"
            line: "{{ item.line }}"
            state: present
        with_items:
            - {
                  regxp: "^pid.*",
                  line: "pid = /run/php/php{{ phpfpm_version }}-fpm.pid",
              }

      - lineinfile:
            dest: "/etc/php/{{ phpfpm_version }}/fpm/pool.d/www.conf"
            regexp: "{{ item.regxp }}"
            line: "{{ item.line }}"
            state: present
        with_items:
            - { regxp: "^(.?)user(.?)=.*", line: "user = root" }
            - { regxp: "^(.?)group(.?)=.*", line: "group = root" }
            - {
                  regxp: "^(.?)listen(.?)=.*",
                  line: "listen = {{ php_fastcgi }}",
              }
            - {
                  regxp: "^(.?)listen.backlog(.?)=.*",
                  line: "listen.backlog = 65536",
              }
            - { regxp: "^(.?)listen.owner(.?)=.*", line: "listen.owner = root" }
            - { regxp: "^(.?)listen.group(.?)=.*", line: "listen.group = root" }
            - { regxp: "^(.?)listen.mode(.?)=.*", line: "listen.mode = 0660" }
            - {
                  regxp: "^(.?)listen.allowed_clients(.?)=.*",
                  line: "listen.allowed_clients = 127.0.0.1",
              }
            - {
                  regxp: "^(.?)security.limit_extensions(.?)=.*",
                  line: "security.limit_extensions = .php .php3 .php4 .php5",
              }
            - { regxp: "^(.?)pm(.?)=.*", line: "pm = ondemand" }
            - {
                  regxp: "^(.?)pm.max_children(.?)=.*",
                  line: "pm.max_children = 75",
              }
            - {
                  regxp: "^(.?)pm.process_idle_timeout(.?)=.*",
                  line: "pm.process_idle_timeout = 10s",
              }
            - {
                  regxp: "^(.?)pm.max_requests(.?)=.*",
                  line: "pm.max_requests = 500",
              }
            - {
                  regxp: '^(.?)env\[''HOSTNAME''\].*',
                  line: "env[HOSTNAME] = $HOSTNAME",
              }
            - {
                  regxp: '^(.?)env\[''PATH''\].*',
                  line: "env[PATH] = /usr/local/bin:/usr/bin:/bin",
              }
            - { regxp: '^(.?)env\[''TMP''\].*', line: "env[TMP] = /tmp" }
            - { regxp: '^(.?)env\[''TMPDIR''\].*', line: "env[TMPDIR] = /tmp" }
            - { regxp: '^(.?)env\[''TEMP''\].*', line: "env[TEMP] = /tmp" }

      - sysctl:
            name: "net.core.somaxconn"
            value: "65536"
            sysctl_set: yes
            state: present

      - sysctl:
            name: "vm.max_map_count"
            value: "262144"
            sysctl_set: yes
            state: present

- name: enable {{ install_role_name }} service
  block:
      - lineinfile:
            dest: "/etc/init.d/php{{ phpfpm_version }}-fpm"
            regexp: "^DAEMON_ARGS="
            line: 'DAEMON_ARGS="--daemonize --allow-to-run-as-root --fpm-config $CONFFILE"'
            state: present

      - lineinfile:
            dest: "/lib/systemd/system/php{{ phpfpm_version }}-fpm.service"
            regexp: "^ExecStart="
            line: "ExecStart=/usr/sbin/php-fpm{{ phpfpm_version }} --nodaemonize --allow-to-run-as-root --fpm-config /etc/php/{{ phpfpm_version }}/fpm/php-fpm.conf"
            state: present

      - lineinfile:
            dest: "/lib/systemd/system/php{{ phpfpm_version }}-fpm.service"
            line: "{{ item }}"
            insertafter: "^ExecStart="
            state: present
        with_items:
            - "ExecStartPost=/bin/sleep 0.1"
            - "Restart=always"
            - "RestartSec=5"

      - file:
            src: "/lib/systemd/system/php{{ phpfpm_version }}-fpm.service"
            dest: "/etc/systemd/system/multi-user.target.wants/php{{ phpfpm_version }}-fpm.service"
            state: link

      - shell: "{{ item }}"
        args:
            chdir: /tmp
        with_items:
            - update-alternatives --set php /usr/bin/php{{ phpfpm_version }}
