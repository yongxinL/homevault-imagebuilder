# Default variables for the services/nodejs role
# ===============================================
# Installs Node.js LTS via the NodeSource binary distribution repository.
# Includes Homebridge companion packages (avahi, mdns) for Apple HomeKit support.

# .. envvar:: install_role_name
#
# Internal name used for log messages and repository file naming.
install_role_name: 'nodejs'

# .. envvar:: nodejs_version
#
# Node.js major version to install from the NodeSource repository.
# NodeSource supports: 18.x (LTS Hydrogen), 20.x (LTS Iron), 22.x, 24.x
# Use 24.x for the latest LTS (Current as of 2025).
# See https://github.com/nodesource/distributions for available versions.
nodejs_version: '24.x'

# .. envvar:: nodejs_repo_keyring
#
# Path where the NodeSource GPG signing key is stored in dearmored binary format.
# Used with the 'signed-by' option in the apt sources.list entry.
nodejs_repo_keyring: '/etc/apt/keyrings/nodesource.gpg'

# .. envvar:: nodejs_repo_key_url
#
# URL of the NodeSource GPG signing key (armored ASCII format).
# Downloaded and dearmored into nodejs_repo_keyring during install.
nodejs_repo_key_url: 'https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key'

# .. envvar:: nodejs_repository
#
# APT source entry for the NodeSource Node.js repository.
# Uses 'nodistro' as the distribution name (NodeSource's universal repository
# that works regardless of the underlying Ubuntu release codename).
nodejs_repository:
  - dest: '/etc/apt/sources.list.d/{{ install_role_name }}.list'
    line: >-
      deb [signed-by={{ nodejs_repo_keyring }}]
      http://deb.nodesource.com/node_{{ nodejs_version }}
      nodistro main

# .. envvar:: nodejs_base_packages
#
# Core Node.js runtime package.
nodejs_base_packages:
  - { package: 'nodejs' }

# .. envvar:: nodejs_packages
#
# Additional packages installed alongside Node.js.
# These are required for Homebridge (Apple HomeKit bridge) which uses mDNS/Bonjour.
nodejs_packages:
  - { package: 'avahi-daemon' }                  # mDNS/DNS-SD daemon (Homebridge)
  - { package: 'avahi-discover' }                # mDNS service browser (Homebridge)
  - { package: 'build-essential' }               # C/C++ build tools for native Node.js modules
  - { package: 'libavahi-compat-libdnssd-dev' }  # Bonjour compatibility library (Homebridge)
  - { package: 'libnss-mdns' }                   # NSS plugin for mDNS hostname resolution
