# =============================================================================
# services/nodejs — Install Node.js from NodeSource repository
# =============================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Create /etc/apt/keyrings directory for GPG key storage.
#   2. Download the NodeSource GPG key and dearmor into the keyring directory.
#   3. Add the NodeSource apt source entry (signed-by reference).
#   4. Remove any conflicting pre-existing packages (nodejs, libdbus).
#   5. Install Node.js and companion packages.
#   6. Install pnpm (via corepack, npm fallback).
#   7. Remove the temporary apt source entry (key remains for live-system updates).
# =============================================================================

---
# ---- GPG keyring setup (modern apt signed-by approach) ----
# Replaces the deprecated apt-key approach removed in Ubuntu 22+.

- name: "nodejs | Create /etc/apt/keyrings directory for trusted signing keys"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755

- name: "nodejs | Download and dearmor NodeSource GPG signing key"
  ansible.builtin.shell: >
    curl -fsSL {{ nodejs_repo_key_url }}
    | gpg --dearmor -o {{ nodejs_repo_keyring }}
  args:
    creates: "{{ nodejs_repo_keyring }}"

- name: "nodejs | Set permissions on NodeSource keyring"
  ansible.builtin.file:
    path: "{{ nodejs_repo_keyring }}"
    mode: 0644

# ---- APT source entry ----

- name: "nodejs | Add NodeSource Node.js {{ nodejs_version }} apt repository"
  ansible.builtin.lineinfile:
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: yes
    state: present
  loop: "{{ nodejs_repository }}"

# ---- Remove conflicting packages ----

- name: "nodejs | Remove conflicting packages before install"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
  loop:
    - libdbus   # older libdbus conflicts with nodejs native addon builds
  ignore_errors: true  # package may not be installed

# ---- Install Node.js and companion packages ----

- name: "nodejs | Install Node.js {{ nodejs_version }} and companion packages"
  ansible.builtin.apt:
    name: "{{ item.package }}{% if item.version is defined and item.version != '*' %}={{ item.version }}{% endif %}"
    state: present
    install_recommends: no
    update_cache: yes
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ nodejs_base_packages + nodejs_packages }}"

# ---- pnpm ----
# pnpm is the preferred package manager for Node.js projects. It is activated
# through corepack (bundled with Node.js >= 16.10, shipped in NodeSource debs).
# COREPACK_ENABLE_DOWNLOAD_PROMPT=0 prevents an interactive Y/n prompt when
# corepack downloads pnpm from the npm registry during image build.

- name: "nodejs | Check if corepack is available"
  ansible.builtin.command: which corepack
  register: nodejs_corepack_bin
  failed_when: false
  changed_when: false

- name: "nodejs | Activate pnpm {{ pnpm_version }} via corepack"
  ansible.builtin.shell: >
    corepack enable pnpm &&
    corepack prepare pnpm@{{ pnpm_version }} --activate
  register: nodejs_pnpm_corepack
  when: nodejs_install_pnpm | bool and nodejs_corepack_bin.rc == 0
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    http_proxy: "{% if apt_proxy | default('') %}http://{{ apt_proxy }}/{% endif %}"
    https_proxy: "{% if apt_proxy | default('') %}http://{{ apt_proxy }}/{% endif %}"

- name: "nodejs | Install pnpm {{ pnpm_version }} via npm (corepack fallback)"
  ansible.builtin.shell: npm install -g pnpm@{{ pnpm_version }}
  register: nodejs_pnpm_npm
  when: nodejs_install_pnpm | bool and nodejs_corepack_bin.rc != 0
  environment:
    http_proxy: "{% if apt_proxy | default('') %}http://{{ apt_proxy }}/{% endif %}"
    https_proxy: "{% if apt_proxy | default('') %}http://{{ apt_proxy }}/{% endif %}"

# ---- Remove build-time apt source entry ----
# The GPG keyring is kept so the live system can run apt-get upgrade.

- name: "nodejs | Remove NodeSource apt source entry (clean image — key is retained)"
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ nodejs_repository }}"
