# Default variables for the services/webmin role
# ===============================================
# Installs Webmin from the official Webmin download repository.
# Webmin 2.x supports Ubuntu 22.04+ (Jammy) and Ubuntu 24.04 (Noble).
#
# Changes from previous version:
#   CHANGED  webmin_repo_key: webmin.domainunion.at → webmin.com (official URL)
#   CHANGED  webmin_repository: old HTTP URL → HTTPS official URL
#   REMOVED  python / python-minimal / python2.7 / python2.7-minimal
#            → Python 2 not available in Ubuntu 22+; Webmin 2.x uses Perl only

# .. envvar:: install_role_name
install_role_name: 'webmin'

# .. envvar:: webmin_repo_key
#
# URL of the Webmin APT repository GPG signing key (James Cameron's key).
# Updated to the official webmin.com URL (the old mirror at webmin.domainunion.at
# may no longer be reliable).
webmin_repo_key: 'https://www.webmin.com/jcameron-key.asc'

# .. envvar:: webmin_repository
#
# APT source entry for the Webmin repository.
# 'sarge' is used as the distribution name (Webmin's own repo label, not Ubuntu).
webmin_repository:
  - dest: '/etc/apt/sources.list.d/{{ install_role_name }}.list'
    line: 'deb http://download.webmin.com/download/repository sarge contrib'

# .. envvar:: target_root_password
#
# Root password used to set the initial Webmin admin password.
target_root_password: 'secret'

# .. envvar:: target_appdata_root
#
# Directory used to store Webmin configuration and module data.
target_appdata_root: '/var/lib'

# .. envvar:: webmin_config_port
#
# TCP port Webmin listens on.  Default is 9900 (avoids conflict with other services).
webmin_config_port: 9900

# .. envvar:: webmin_base_packages
#
# Core Webmin package.
# NOTE: apt-show-versions is already installed by basefs (vars/basefs.yml)
#       and does not need to be re-declared here.
webmin_base_packages:
  - { package: 'webmin' }

# .. envvar:: webmin_packages
#
# Perl library dependencies required by Webmin LDAP and other modules.
# NOTE: python / python2.7 packages are REMOVED — Python 2 is not available
# in Ubuntu 22+ and Webmin 2.x does not require Python.
webmin_packages:
  - { package: 'libconvert-asn1-perl' }    # ASN.1 library (LDAP module)
  - { package: 'libnet-ldap-perl' }        # Net::LDAP Perl module (LDAP module)
  - { package: 'libtext-unidecode-perl' }  # Unicode transliteration (filemin module)

# .. envvar:: webmin_configuration
#
# Configuration files deployed for Webmin.
webmin_configuration:
  - { name: 'etc-webmin-miniserv.conf.j2',
      dest: '/etc/webmin/miniserv.conf' }
  - { name: 'etc-init.d-init-webmin.sh.j2',
      dest: '/etc/init.d/init-webmin.sh',
      mode: "0755" }

# .. envvar:: debian_config_root
# .. envvar:: debian_module_root
#
# Standard Webmin paths in Debian/Ubuntu.
debian_config_root: "/etc/webmin"
debian_module_root: "/usr/share/webmin"

# .. envvar:: webmin_module_removal
#
# List of Webmin standard modules to remove after installation.
# Only modules relevant to this server's role (NAS/NFS/Samba/Docker) are kept.
# Full module list: http://www.webmin.com/standard.html
webmin_module_removal:
  - adsl-client
