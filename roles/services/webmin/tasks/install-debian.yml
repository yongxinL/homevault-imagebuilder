# =============================================================================
# services/webmin — Install Webmin 2.x from the official repository
# ==================================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Download and add the Webmin repository GPG key.
#   2. Add the Webmin apt source entry.
#   3. Disable GzipIndexes in apt.conf (required by the Webmin repository).
#   4. Install Webmin and Perl dependency packages.
#   5. Remove the build-time apt source entry.
# =============================================================================

---
# ---- GPG key ----
# Webmin uses apt-key style key addition via apt_key URL.
# The Webmin repo uses a legacy single-key approach compatible with Noble.

- name: "webmin | Add Webmin GPG repository signing key"
  ansible.builtin.apt_key:
    url: "{{ webmin_repo_key }}"
    state: present

# ---- APT source entry ----

- name: "webmin | Add Webmin apt repository"
  ansible.builtin.lineinfile:
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: true
    state: present
  loop: "{{ webmin_repository }}"

# ---- apt.conf workaround ----
# The Webmin repository does not support gzip-compressed index files.

- name: "webmin | Disable GzipIndexes in apt.conf (required for Webmin repo)"
  ansible.builtin.lineinfile:
    dest: "/etc/apt/apt.conf"
    line: 'Acquire::GzipIndexes "false";'
    create: true
    state: present

# ---- Install Webmin packages ----

- name: "webmin | Install Webmin and Perl dependency packages"
  ansible.builtin.apt:
    name: "{{ item.package }}{% if item.version is defined and item.version != '*' %}={{ item.version }}{% endif %}"
    state: present
    install_recommends: false
    update_cache: true
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ webmin_base_packages + webmin_packages }}"

# ---- Remove build-time apt source entry ----

- name: "webmin | Remove Webmin apt source entry"
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ webmin_repository }}"
