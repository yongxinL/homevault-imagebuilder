# =============================================================================
# services/webmin — Install Webmin 2.x from the official repository
# ==================================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Create the APT keyrings directory.
#   2. Download the Webmin repository GPG key into /etc/apt/keyrings.
#   3. Add the Webmin apt source entry (signed-by reference).
#   4. Disable GzipIndexes in apt.conf (required by the Webmin repository).
#   5. Install Webmin and Perl dependency packages.
#   6. Remove the build-time apt source entry (key is retained for live updates).
# =============================================================================

---
# ---- GPG key ----
# The signing key is downloaded to /etc/apt/keyrings and referenced by the
# signed-by= option in the apt source entry (modern replacement for apt_key).

- name: "webmin | Create /etc/apt/keyrings directory"
  ansible.builtin.file:
    path: "{{ webmin_repo_keyring | dirname }}"
    state: directory
    mode: '0755'

- name: "webmin | Download Webmin GPG repository signing key"
  ansible.builtin.get_url:
    url: "{{ webmin_repo_key }}"
    dest: "{{ webmin_repo_keyring }}"
    mode: '0644'
    force: true

# ---- APT source entry ----

- name: "webmin | Add Webmin apt repository"
  ansible.builtin.lineinfile:
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: true
    state: present
  loop: "{{ webmin_repository }}"

# ---- apt.conf workaround ----
# The Webmin repository does not support gzip-compressed index files.

- name: "webmin | Disable GzipIndexes in apt.conf (required for Webmin repo)"
  ansible.builtin.lineinfile:
    dest: "/etc/apt/apt.conf"
    line: 'Acquire::GzipIndexes "false";'
    create: true
    state: present

# ---- Install Webmin packages ----

- name: "webmin | Install Webmin and Perl dependency packages"
  ansible.builtin.apt:
    name: "{{ item.package }}{% if item.version is defined and item.version != '*' %}={{ item.version }}{% endif %}"
    state: present
    install_recommends: false
    update_cache: true
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ webmin_base_packages + webmin_packages }}"

# ---- Remove build-time apt source entry ----

- name: "webmin | Remove Webmin apt source entry"
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ webmin_repository }}"
