# =============================================================================
# services/docker — Post-install configuration for Docker CE (Ubuntu 22/24)
# =============================================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Create /etc/docker and /etc/containerd directories.
#   2. Deploy daemon.json, containerd config.toml, and init-docker.sh.
#   3. Create a systemd drop-in for containerd.service so init-docker.sh runs
#      as ExecStartPre before containerd (and therefore docker) starts.
#      init-docker.sh creates the data directories on the ext4 data partition
#      at first boot, after casper has mounted the partition but before the
#      container runtime starts.
#   4. Enable docker and containerd to start at boot.
#
# Why ExecStartPre on containerd.service (not docker.service)?
#   docker.service depends on containerd.service, so containerd always starts
#   first. Hooking into containerd ensures the data directories exist before
#   the overlayfs snapshotter in containerd tries to use them.
#
# Why a separate init script instead of letting Docker auto-create the dirs?
#   Docker's daemon.json data-root only controls dockerd's own data. Containerd
#   has its own root configured in /etc/containerd/config.toml. Both paths live
#   on the data partition ({{ target_appdata_root }}), which is mounted by casper
#   at boot time — they cannot be pre-created in the squashfs.
# =============================================================================

---
- name: "docker | Create config directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - /etc/docker
    - /etc/containerd

- name: "docker | Deploy configuration files"
  ansible.builtin.template:
    src: "{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  with_items: "{{ docker_configuration }}"

# ---- systemd drop-in: run init-docker.sh before containerd starts ----

- name: "docker | Create containerd systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: "docker | Deploy containerd drop-in to run init-docker.sh as ExecStartPre"
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd.service.d/pre-start.conf
    owner: root
    group: root
    mode: 0644
    content: |
      [Service]
      ExecStartPre=/etc/init.d/init-docker.sh

# ---- Service management ----

- name: "docker | Enable containerd and docker to start at boot"
  ansible.builtin.command: systemctl enable {{ item }}
  with_items:
    - containerd
    - docker
