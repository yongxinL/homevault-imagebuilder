# =============================================================================
# services/docker — Install Docker CE from the official Docker repository
# ========================================================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Create /etc/apt/keyrings directory.
#   2. Download and dearmor the Docker GPG signing key.
#   3. Add the Docker CE apt source entry (signed-by reference).
#   4. Install prerequisite packages (apt-transport-https, ca-certificates, etc.).
#   5. Install Docker CE packages (docker-ce, cli, containerd, buildx, compose-plugin).
#   6. Add configured user accounts to the docker group.
#   7. Remove the build-time apt source entry (key is retained for live updates).
#
# Docker Compose v2 note:
#   This role installs docker-compose-plugin which provides 'docker compose'
#   (with a space).  The old standalone 'docker-compose' binary (v1) is removed.
#   Scripts using 'docker-compose' (hyphen) must be updated to 'docker compose'.
# =============================================================================

---
# ---- GPG keyring setup ----

- name: "docker | Create {{ docker_repo_keyring }} directory"
  ansible.builtin.file:
    path: "{{ docker_repo_keyring }}"
    state: directory
    mode: 0755

- name: "docker | Download and dearmor Docker GPG signing key"
  ansible.builtin.shell: >
    curl -fsSL {{ docker_repo_key_url }}
    | gpg --dearmor -o {{ docker_repo_keyring ~ '/' ~ install_role_name ~ '.gpg' }}
  args:
    creates: "{{ docker_repo_keyring ~ '/' ~ install_role_name ~ '.gpg' }}"

- name: "docker | Set permissions on Docker keyring"
  ansible.builtin.file:
    path: "{{ docker_repo_keyring ~ '/' ~ install_role_name ~ '.gpg' }}"
    mode: 0644

# ---- APT source entry ----

- name: "docker | Add Docker CE stable apt repository"
  ansible.builtin.lineinfile:
    dest: "{{ item.dest }}"
    line: "{{ item.line }}"
    create: true
    state: present
  loop: "{{ docker_repository }}"

# ---- Install prerequisite packages ----

- name: "docker | Install Docker prerequisite packages"
  ansible.builtin.apt:
    name: "{{ item.package }}"
    state: present
    install_recommends: false
    update_cache: true
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ docker_base_packages }}"

# ---- Install Docker CE packages ----

- name: "docker | Install Docker CE, CLI, containerd, buildx, and compose plugin"
  ansible.builtin.apt:
    name: "{{ item.package }}{% if item.version is defined and item.version != '*' %}={{ item.version }}{% endif %}"
    state: present
    install_recommends: false
    update_cache: true
  register: install_pkgs
  until: install_pkgs is success
  retries: 2
  delay: 5
  environment:
    DEBIAN_FRONTEND: noninteractive
  loop: "{{ docker_packages }}"

# ---- Group membership ----

- name: "docker | Add users to docker group"
  ansible.builtin.user:
    name: '{{ item }}'
    groups: 'docker'
    append: true
  loop: "{{ docker_admins }}"
  when: docker_admins is defined

# ---- Remove build-time apt source entry ----

- name: "docker | Remove Docker apt source entry (key retained for live updates)"
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: absent
  loop: "{{ docker_repository }}"
