# Default variables for the services/docker role
# ===============================================
# Installs Docker CE from the official Docker Inc. APT repository.
#
# Changes from Ubuntu 16 (Xenial):
#   CHANGED  Repository URL: apt.dockerproject.org → download.docker.com
#   CHANGED  GPG key:        sks-keyservers.net (defunct) → download.docker.com/linux/ubuntu/gpg
#   CHANGED  Package:        docker-engine → docker-ce + docker-ce-cli + containerd.io
#   REMOVED  aufs-tools      → aufs kernel module removed in Ubuntu 20+; overlayfs is used
#   REMOVED  pip docker-compose (v1) → replaced by docker-compose-plugin (v2, apt package)
#   ADDED    docker-buildx-plugin  → BuildKit multi-platform builds
#   ADDED    docker-compose-plugin → Docker Compose v2 (replaces standalone docker-compose)

# .. envvar:: install_role_name
#
# Internal name used for log messages and repository file naming.
install_role_name: 'docker'

# .. envvar:: target_appdata_root
#
# Directory where Docker stores its data (images, containers, volumes).
# Relocated to the persistent data partition so container data survives reboots.
target_appdata_root: '/var/lib'

# .. envvar:: docker_repo_keyring
#
# Path where the Docker GPG signing key is stored in dearmored binary format.
docker_repo_keyring: '/etc/apt/trusted.gpg.d'

# .. envvar:: docker_repo_key_url
#
# URL of the Docker GPG signing key (armored ASCII format).
docker_repo_key_url: 'https://download.docker.com/linux/ubuntu/gpg'

# .. envvar:: docker_repository
#
# APT source entry for the Docker CE stable repository.
# Uses 'signed-by' (modern apt approach, replaces deprecated apt-key).
# Proxy is handled transparently by /etc/apt/apt.conf.d/00proxy — no proxy
# prefix needed in the URL.
docker_repository:
  - dest: '/etc/apt/sources.list.d/{{ install_role_name }}.list'
    line: >-
      deb [arch=amd64 signed-by={{ docker_repo_keyring ~ '/' ~ install_role_name ~ '.gpg' }}]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable

# .. envvar:: docker_base_packages
#
# Prerequisite packages required before Docker CE can be installed.
# NOTE: ca-certificates and curl are already installed by basefs (vars/basefs.yml)
#       and do not need to be re-declared here.
# NOTE: aufs-tools removed — aufs kernel module does not exist in Ubuntu 20+.
#       Docker automatically uses the overlayfs2 storage driver on Noble.
docker_base_packages: []

# .. envvar:: docker_packages
#
# Docker CE packages to install from the official Docker repository.
#   docker-ce             — Docker daemon
#   docker-ce-cli         — Docker command-line client
#   containerd.io         — Container runtime
#   docker-buildx-plugin  — BuildKit multi-platform build plugin
#   docker-compose-plugin — Docker Compose v2 (replaces standalone docker-compose v1)
#
# After install, 'docker compose' (space, not hyphen) invokes Compose v2.
docker_packages:
  - { package: 'docker-ce' }
  - { package: 'docker-ce-cli' }
  - { package: 'containerd.io' }
  - { package: 'docker-buildx-plugin' }
  - { package: 'docker-compose-plugin' }

# .. envvar:: docker_configuration
#
# Configuration files deployed into the base filesystem for Docker.
#   etc-docker-daemon.json.j2 — /etc/docker/daemon.json: sets data-root (Ubuntu 22/24, systemd)
#
# NOTE: etc-default-docker (DOCKER_OPTS) was removed — ignored by systemd.
#       The pre-start init script was removed — Docker auto-creates data-root on first start.
docker_configuration:
  - { name: 'etc-docker-daemon.json.j2',
      dest: '/etc/docker/daemon.json' }
  - { name: 'etc-containerd-config.toml.j2',
      dest: '/etc/containerd/config.toml' }
  - { name: 'etc-init.d-init-docker.sh.j2',
      dest: '/etc/init.d/init-docker.sh', mode: "0755" }

# .. envvar:: docker_admins
#
# List of UNIX accounts added to the 'docker' group, granting access to the
# Docker UNIX socket without requiring sudo.
docker_admins:
  - root
