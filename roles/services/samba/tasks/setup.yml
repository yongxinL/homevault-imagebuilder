# =============================================================================
# services/samba — Post-install configuration
# ============================================
# Runs on: build_rootfs (inside the chroot)
#
# Steps:
#   1. Ensure the data partition mount point exists in the squashfs so casper
#      can mount the data partition at boot.  Share subdirectories (dataLibrary
#      etc.) live on the data partition and are created at first boot by the
#      init-samba.sh ExecStartPre script — not here.
#   2. Deploy smb.conf and the init-samba.sh first-boot init script.
#   3. Create a systemd drop-in for smbd so init-samba.sh runs as ExecStartPre
#      before smbd starts (creates share dirs, patches netbios name in smb.conf).
#   4. Disable samba-ad-dc (not used in standalone file-server mode).
#   5. Enable smbd and nmbd via systemd (replaces the legacy rc.local approach).
#
# Why systemd instead of rc.local?
#   rc.local is a legacy Ubuntu 14/16 mechanism. On Noble (systemd-only), it
#   requires an extra rc-local.service shim and runs with no dependency ordering
#   guarantees relative to network or filesystem mounts. Using systemd enables
#   and an ExecStartPre drop-in is the correct modern approach.
#
# Why ExecStartPre for init-samba.sh instead of building it into smb.conf?
#   - The netbios name must match the runtime hostname (set by casper), which
#     is not known at build time.
#   - Share directories live on the data partition (/oneLijia) which is mounted
#     by casper before systemd starts — but only at runtime, not in the squashfs.
#   - init-samba.sh is guarded by a stamp file so it runs only on first boot.
# =============================================================================

---
# ---- Ensure data partition mount point exists in squashfs ----
# casper mounts the data partition at {{ target_data_root }} during initrd.
# The mount point must exist as a directory in the squashfs before the mount.
# Share subdirectories are created on the data partition by init-samba.sh.

- name: "setup | Ensure data partition mount point exists in squashfs"
  ansible.builtin.file:
    path: "{{ target_data_root }}"
    state: directory
    mode: 0755

# ---- Deploy samba configuration files ----

- name: "setup | Deploy samba configuration files"
  ansible.builtin.template:
    src: "{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  with_items: "{{ samba_configuration }}"

# ---- systemd drop-in: run init-samba.sh before smbd starts ----
# init-samba.sh (first-boot guard):
#   - patches netbios name in smb.conf to match runtime hostname
#   - creates share directories on the data partition
# The drop-in is on smbd only; nmbd inherits the share directories via smbd.

- name: "setup | Create smbd systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/smbd.service.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: "setup | Deploy smbd drop-in to run init-samba.sh as ExecStartPre"
  ansible.builtin.copy:
    dest: /etc/systemd/system/smbd.service.d/pre-start.conf
    owner: root
    group: root
    mode: 0644
    content: |
      [Service]
      ExecStartPre=/etc/init.d/init-samba.sh

# ---- Service management ----

- name: "setup | Disable samba-ad-dc (not used in standalone file-server mode)"
  ansible.builtin.command: systemctl disable samba-ad-dc
  ignore_errors: true

- name: "setup | Enable smbd and nmbd to start at boot via systemd"
  ansible.builtin.command: systemctl enable {{ item }}
  with_items:
    - smbd
    - nmbd

# ---- UFW firewall rule ----

- name: "samba | Check if ufw is available"
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_bin

- name: "samba | Allow Samba through ufw (ports 137/138 UDP, 139/445 TCP)"
  ansible.builtin.command: ufw allow Samba
  when: ufw_bin.stat.exists
