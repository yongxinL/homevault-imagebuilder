---
- name: delete update-motd.d direcotry
  file:
    path: "/etc/update-motd.d"
    state: absent

- name: create update-motd.d directory
  file:
    path: "/etc/update-motd.d"
    state: directory

- name: upload {{ install_role_name }} configuration files
  template:
    src: "{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode|default('0644') }}"
  with_items: "{{ openssh_configuration }}"

- name: update {{ install_role_name }} configuration file
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.regxp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - { regxp: '^PermitRootLogin.*', line: 'PermitRootLogin yes' }
    - { regxp: '^#Banner.*', line: 'Banner /etc/issue.net' }
    - { regxp: '^##GSSAPIAuthentication.*', line: 'GSSAPIAuthentication no' }

# ---- UFW firewall rule ----

- name: "openssh | Check if ufw is available"
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_bin

- name: "openssh | Allow OpenSSH through ufw (port 22/tcp)"
  ansible.builtin.command: ufw allow OpenSSH
  when: ufw_bin.stat.exists
