# Default variables for the basefs/build-basefs role
# ===================================================
# These defaults are used when the corresponding variable is not set in
# group_vars/in_target.yml or any vars/ file.

# .. envvar:: target_root_password
#
# Fallback root password (plain-text; hashed with SHA-512 during build).
# Override this in group_vars/in_target.yml.
target_root_password: 'secret'

# .. envvar:: target_timezone
#
# Fallback IANA timezone string.  Override in group_vars/in_target.yml.
target_timezone: 'Australia/Sydney'

# .. envvar:: target_ntpserver
#
# Fallback NTP pool base name used to configure chrony.
# Override in group_vars/in_target.yml.
target_ntpserver: 'au.pool.ntp.org'

# .. envvar:: target_data_root
#
# Fallback data root directory.  Override in group_vars/in_target.yml.
target_data_root: '/var'

# .. envvar:: overylay_private_root
#
# Fallback read-write overlay root directory on the persistent data partition.
overylay_private_root: '{{ target_data_root }}/private'

# .. envvar:: basefs_configuration
#
# List of configuration templates deployed into the base filesystem.
# The network configuration uses Netplan (replaces legacy ifupdown interfaces file).
# Each entry must provide:
#   name — template file name (relative to the role templates/ directory)
#   dest — absolute destination path inside the chroot
#   mode — (optional) file permission mode, default '0644'
basefs_configuration: []
# NOTE: Network configuration is now handled directly in setup.yml using the
# etc-netplan-01-netcfg.yaml.j2 template. No additional entries needed here.

# .. envvar:: basefs_init_script
#
# Boot scripts deployed into the base filesystem.
# - mount-overlayfs (init.d script): provides start/stop logic for writable overlays.
# - overlayfs.service (systemd unit): enables the script as a systemd service that
#   runs before sysinit.target so /etc and /var/log are writable from first use.
basefs_init_script:
  - { name: "etc-init.d-mount-overlayfs.j2",
      dest: "/etc/init.d/mount-overlayfs",
      mode: "0755" }
  - { name: "lib-systemd-system-overlayfs.service.j2",
      dest: "/lib/systemd/system/overlayfs.service",
      mode: "0644" }
