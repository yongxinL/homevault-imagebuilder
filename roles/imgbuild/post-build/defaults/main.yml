# .. envvar:: syslinux_packages
#
# Utility binaries copied from the chroot into the ISO directory tree.
syslinux_packages:
  - bin/cpio
  - usr/bin/mcopy
  - usr/bin/mtools
  - usr/bin/mattrib
  - usr/bin/syslinux
