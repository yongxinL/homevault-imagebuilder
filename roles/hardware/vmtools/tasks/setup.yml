---
# ---- VMware NIC — Netplan static IP ----

- name: "vmtools | Ensure /etc/netplan directory exists"
  ansible.builtin.file:
    path: /etc/netplan
    state: directory
    owner: root
    group: root
    mode: 0755
  when: vmtools_static_nic | length > 0

- name: "vmtools | Deploy Netplan static config for {{ vmtools_static_nic }} (02-vmware-static.yaml)"
  ansible.builtin.template:
    src: "etc-netplan-02-vmware-static.yaml.j2"
    dest: "/etc/netplan/02-vmware-static.yaml"
    owner: root
    group: root
    mode: 0600
  when: vmtools_static_nic | length > 0

# ---- open-vm-tools service ----

- name: "vmtools | Enable open-vm-tools service (systemd)"
  ansible.builtin.systemd:
    name: open-vm-tools
    enabled: yes