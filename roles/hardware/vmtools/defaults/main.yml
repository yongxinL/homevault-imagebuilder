# Default variables
# =================

# .. contents:: Sections
#    :local:
#
# ------------------------------------
#   Packages and installation
# ------------------------------------
install_role_name: 'vmtools'

# .. envvar:: vmtools_base_packages
#
# List of base packages to install by Ansible
# package: package will be installed
# version: package version, default is '*'
# example: - { package: 'package', version: '1.2' }
vmtools_base_packages:
  - { package: 'open-vm-tools' }

# .. envvar:: vmtools_packages
#
# List of additional packages to install by Ansible
# package: package will be installed
# version: package version, default is '*'
# example: - { package: 'package', version: '1.2' }
vmtools_packages: []

# ------------------------------------
#   VMware NIC — static IP (Netplan)
# ------------------------------------

# .. envvar:: vmtools_primary_nic
#
# Name of the primary VMware NIC.  Always written into the Netplan config —
# as a static interface when vmtools_static_nic matches, or as DHCP fallback
# when vmtools_static_nic is empty.
vmtools_primary_nic: 'ens192'

# .. envvar:: vmtools_static_nic
#
# Set to the primary NIC name (e.g. 'ens192') to assign a static IP.
# Set to '' to fall back to DHCP on vmtools_primary_nic instead.
vmtools_static_nic: 'ens192'

# .. envvar:: vmtools_static_address
#
# Static IPv4 address in CIDR notation assigned to vmtools_static_nic.
vmtools_static_address: '192.168.0.1/24'

# .. envvar:: vmtools_static_gateway
#
# Default gateway for the VMware NIC.  Leave '' to omit the route stanza
# (useful when the NIC is management-only on a local subnet).
vmtools_static_gateway: '192.168.0.1'

# .. envvar:: vmtools_static_dns
#
# List of DNS server addresses for the VMware NIC.
# Leave [] to omit the nameservers stanza and inherit from DHCP on other NICs.
vmtools_static_dns: ['8.8.8.8', '192.168.0.1']

# .. envvar:: vmtools_dhcp_nic
#
# VMware NIC interface name to configure with DHCP via Netplan.
# Typically 'ens225' for a second VMXNET3 adapter.
# Set to '' to skip adding a DHCP NIC to the Netplan config.
vmtools_dhcp_nic: 'ens224'

# ------------------------------------
#   Configuration files
# ------------------------------------

# .. envvar:: docker_configuration
#
# List of configuration file will be copy to Linux base filesystems
vmtools_configuration: []
# All legacy ifupdown config and init scripts have been removed.
# Network configuration is now handled by Netplan (02-vmware-static.yaml above).
