# Ansible inventory — build host definitions
# ===========================================
# This file defines the two host groups used across all four build playbooks:
#
#   build_local  — the machine running ansible-playbook (localhost).
#                  Used for host-side tasks: mounting tmpfs, running debootstrap,
#                  creating squashfs images, and assembling the ISO.
#
#   build_rootfs — the debootstrap chroot at /opt/in_target/build/rootfs.
#                  Ansible connects via the 'chroot' plugin so all in-target
#                  tasks (package install, service config) run inside the chroot.
#
# Both groups are children of 'in_target', which carries the shared build-path
# variables consumed by every playbook in the pipeline.

all:
  children:

    # ----------------------------------------
    # in_target — parent group for all build hosts
    # Shared variables are defined here so every play
    # (build_local and build_rootfs) can access them.
    # ----------------------------------------
    in_target:
      vars:
        # Root working directory for all build artefacts on the build host.
        # Change this single value to relocate the entire build tree.
        build_root_dir: /opt/in_target

        # Primary chroot path — referenced as {{ build_rootfs }} in all playbooks
        build_rootfs: "{{ build_root_dir }}/build/rootfs"

        # OverlayFS mount directories used during build_overlayfs.yml:
        #   lower — read-only mount point where basefs.squashfs is loopback-mounted
        #   upper — read-write layer that captures overlay filesystem changes
        #   work  — required scratch directory for the kernel overlayfs driver
        build_lower_dir: "{{ build_root_dir }}/build/lower"
        build_upper_dir: "{{ build_root_dir }}/build/upper"
        build_work_dir: "{{ build_root_dir }}/build/work"

        # Output directory where the ISO directory tree is assembled
        # (casper/, isolinux/, syslinux/, EFI/ sub-directories are created here)
        build_image_root: "{{ build_root_dir }}/image"

        # Final ISO output directory — the completed .iso file is written here
        build_iso_output_dir: "{{ build_root_dir }}/output"

      children:

        # ----------------------------------------
        # build_local — the Ansible controller (localhost)
        # Runs host-side tasks: tmpfs mount/unmount, debootstrap, mksquashfs,
        # genisoimage/xorriso, and overlay mount/unmount.
        # ----------------------------------------
        build_local:
          hosts:
            localhost:
              ansible_connection: local
              ansible_python_interpreter: /usr/bin/python3

        # ----------------------------------------
        # build_rootfs — the debootstrap chroot
        # Ansible's chroot connection plugin uses ansible_host as the chroot path.
        # All package installation and service configuration tasks target this group.
        # ----------------------------------------
        build_rootfs:
          hosts:
            rootfs_chroot:
              ansible_host: "{{ build_root_dir }}/build/rootfs"
              ansible_connection: chroot
              ansible_python_interpreter: /usr/bin/python3
